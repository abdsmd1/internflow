# Sert l'application React et relaie /api vers le service API (même origine : pas de CORS).
server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assistant IA : service optionnel (profil « ai »). Le nom est résolu à chaque
    # requête par le DNS de Docker, pour que nginx démarre même sans l'assistant.
    location /api/v1/agent/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $agent_upstream http://agent:8100;
        proxy_pass $agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 330s; # un modèle local sur processeur peut être lent
        client_max_body_size 64k;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # Fichiers versionnés par Vite (nom avec empreinte) : cache d'un an.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Application monopage : toute autre URL renvoie index.html, jamais mis en cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
