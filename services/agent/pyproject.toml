[project]
name = "internflow-agent"
version = "0.1.0"
description = "InternFlow — assistant IA (LangGraph) qui agit via l'API, avec validation humaine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.140,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "langchain-core>=1.6,<2",
  "langchain-ollama>=1.1,<2",
  "ollama>=0.6,<1",
  "langchain-openai>=1.7,<2",
  "structlog>=26.1,<27",
]

[project.optional-dependencies]
# Fournisseurs payants, à installer seulement si on les utilise.
anthropic = ["langchain-anthropic>=1.7,<2"]

[project.scripts]
internflow-agent-eval = "internflow_agent.evals:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx2>=1.0",
  "mypy>=2.3",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internflow_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov=internflow_agent", "--cov-report=term-missing"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["*/evals.py"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
