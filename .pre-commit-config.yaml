# Contrôles exécutés automatiquement avant chaque commit (make install les active).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch      # interdit les commits directs sur main
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks                 # bloque les secrets (clés API, mots de passe)

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen               # impose les Conventional Commits
        stages: [commit-msg]

  # Outils Python exécutés via uv : mêmes versions que dans uv.lock et en CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd services/api && uv run mypy'
        language: system
        types: [python]
        pass_filenames: false
