name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # moindre privilège pour le jeton GitHub

env:
  UV_FROZEN: "1"   # échoue si uv.lock n'est pas à jour

jobs:
  quality:
    name: Lint & typage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # pas d'étiquette courte « v10 » publiée
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - run: make lint
      - run: make typecheck

  tests:
    name: Tests (unitaires + intégration PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: internflow
          POSTGRES_PASSWORD: internflow
          POSTGRES_DB: internflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U internflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INTERNFLOW_TEST_DATABASE_URL: postgresql+psycopg://internflow:internflow@localhost:5432/internflow_test
      PGJDBC_VERSION: 42.7.13
      PGJDBC_SHA256: 6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages
      - name: Java 21 (requis par PySpark)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Pilote JDBC PostgreSQL (empreinte vérifiée)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/postgresql.jar" \
            "https://github.com/pgjdbc/pgjdbc/releases/download/REL${PGJDBC_VERSION}/postgresql-${PGJDBC_VERSION}.jar"
          echo "${PGJDBC_SHA256}  $RUNNER_TEMP/postgresql.jar" | sha256sum --check
          echo "INTERNFLOW_DATA_JDBC_DRIVER_JAR=$RUNNER_TEMP/postgresql.jar" >> "$GITHUB_ENV"
      - name: Migrations à jour avec le modèle (alembic check)
        env:
          INTERNFLOW_DATABASE_URL: postgresql+psycopg://internflow:internflow@localhost:5432/internflow_test
        run: cd services/api && uv run alembic upgrade head && uv run alembic check
      - name: Tests de l'API avec couverture (seuil 85 %)
        run: cd services/api && uv run pytest --cov-report=xml
      - name: Tests du pipeline PySpark avec couverture (seuil 85 %)
        run: cd data && uv run pytest --cov-report=xml
      - name: Tests de l'assistant IA avec couverture (seuil 85 %, modèle simulé)
        run: cd services/agent && uv run pytest --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            services/api/coverage.xml
            services/agent/coverage.xml
            data/coverage.xml

  frontend:
    name: Frontend (lint, typage, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types TypeScript à jour avec le contrat OpenAPI
        run: npm run gen:api && git diff --exit-code -- src/api/
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests avec couverture (seuil 80 %)
        run: npm test
      - run: npm run build
      - name: Vulnérabilités connues des dépendances livrées (npm audit)
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Sécurité des dépendances et du code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Vulnérabilités connues (pip-audit)
        run: uv export --all-packages --all-extras --no-dev --no-hashes --no-emit-workspace -o requirements.txt && uvx pip-audit -r requirements.txt
      - name: Secrets dans tout l'historique Git (gitleaks)
        # Binaire officiel épinglé : plus fiable que gitleaks-action,
        # qui échoue au premier push d'une branche.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --verbose

  docker:
    name: Build & scan de l'image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [quality, tests, frontend]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            dockerfile: services/api/Dockerfile
            skip-dirs: ""
          - image: agent
            context: .
            dockerfile: services/agent/Dockerfile
            skip-dirs: ""
          - image: web
            context: frontend
            dockerfile: frontend/Dockerfile
            skip-dirs: ""
          - image: data
            context: .
            dockerfile: data/Dockerfile
            # Jars Java embarqués par PySpark : mis à jour avec Spark, pas un par un.
            # Ils sont analysés à part, pour information (voir ADR 0009).
            skip-dirs: /app/.venv/lib/python3.12/site-packages/pyspark/jars
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: internflow-${{ matrix.image }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Test de fumée de l'image data (Java, pilote JDBC lisible, CLI)
        if: matrix.image == 'data'
        run: |
          docker run --rm --entrypoint sh internflow-data:ci -c \
            'java -version && test -r "$INTERNFLOW_DATA_JDBC_DRIVER_JAR" && internflow-data --help'
      - name: Test de fumée de l'image api (modèle d'embeddings embarqué, hors ligne)
        if: matrix.image == 'api'
        # --network none : prouve que le modèle est bien dans l'image ; --read-only :
        # comme dans Compose. On vérifie aussi que le modèle comprend le SENS en français.
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp internflow-api:ci python - <<'EOF'
          import math, os
          from internflow_api.infrastructure.search.fastembed_embedder import FastEmbedEmbedder

          model = FastEmbedEmbedder(
              os.environ["INTERNFLOW_EMBEDDING_MODEL"],
              dimension=384,
              cache_dir=os.environ["INTERNFLOW_EMBEDDING_CACHE_DIR"],
          )

          def cosine(a, b):
              dot = sum(x * y for x, y in zip(a, b))
              return dot / (math.sqrt(sum(x * x for x in a)) * math.sqrt(sum(y * y for y in b)))

          question = model.embed_query("problèmes de déploiement avec Docker")
          close, far = model.embed_passages(
              ["Difficultés : les conteneurs ne démarrent pas sur le serveur.",
               "Réalisations : rédaction de la recette du couscous."]
          )
          print(f"proche : {cosine(question, close):.2f} | sans rapport : {cosine(question, far):.2f}")
          assert cosine(question, close) > cosine(question, far)
          EOF
      - name: Test de fumée de l'image agent (démarrage et santé)
        if: matrix.image == 'agent'
        run: |
          docker run -d --name agent --read-only --tmpfs /tmp -p 8100:8100 internflow-agent:ci
          for i in $(seq 1 15); do curl -fsS http://localhost:8100/health/live && break; sleep 1; done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8100/api/v1/agent/chat -H "Content-Type: application/json" -d '{"message":"test"}')
          test "$code" = "401"
      - name: Test de fumée de l'image web (nginx démarre et sert l'application)
        if: matrix.image == 'web'
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --add-host api:127.0.0.1 -p 8080:8080 internflow-web:ci
          for i in $(seq 1 10); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/stages | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
      - name: Scan de vulnérabilités bloquant (système + dépendances)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: internflow-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: ${{ matrix.skip-dirs }}
          exit-code: "1"
      - name: Rapport informatif sur les jars de Spark
        if: matrix.image == 'data'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: internflow-data:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
