# Environnement de développement local.
# Usage : cp .env.example .env && make up
name: internflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-internflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # exposé uniquement en local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job ponctuel : applique les migrations puis s'arrête.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      INTERNFLOW_ENVIRONMENT: ${INTERNFLOW_ENVIRONMENT:-local}
      INTERNFLOW_LOG_LEVEL: ${INTERNFLOW_LOG_LEVEL:-INFO}
      INTERNFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-internflow}
      INTERNFLOW_CORS_ORIGINS: ${INTERNFLOW_CORS_ORIGINS:-[]}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      # Uniquement pour l'API : les migrations n'ont pas besoin de ce secret.
      INTERNFLOW_JWT_SECRET: ${INTERNFLOW_JWT_SECRET:?définir INTERNFLOW_JWT_SECRET dans .env}
      INTERNFLOW_ACCESS_TOKEN_TTL_MINUTES: ${INTERNFLOW_ACCESS_TOKEN_TTL_MINUTES:-30}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Interface web : fichiers React servis par nginx, qui relaie /api vers l'API.
  web:
    build:
      context: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Assistant IA (profil « ai ») : docker compose --profile ai up -d
  # Le modèle est soit une API cloud compatible OpenAI (Groq, gratuit avec une clé :
  # rapide, rien à télécharger), soit Ollama en local (profil « ollama » en plus).
  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    profiles: [ai]
    restart: unless-stopped
    environment:
      INTERNFLOW_AGENT_API_URL: http://api:8000
      INTERNFLOW_AGENT_LLM_PROVIDER: ${INTERNFLOW_AGENT_LLM_PROVIDER:-ollama}
      INTERNFLOW_AGENT_LLM_MODEL: ${INTERNFLOW_AGENT_LLM_MODEL:-qwen2.5:3b}
      INTERNFLOW_AGENT_LLM_API_KEY: ${INTERNFLOW_AGENT_LLM_API_KEY:-}
      INTERNFLOW_AGENT_OPENAI_BASE_URL: ${INTERNFLOW_AGENT_OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      # Ollama dans Docker (profil « ollama ») ou installé sur Windows :
      # http://host.docker.internal:11434
      INTERNFLOW_AGENT_OLLAMA_URL: ${INTERNFLOW_AGENT_OLLAMA_URL:-http://ollama:11434}
    depends_on:
      api:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: false # absent si on utilise une API cloud
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Modèle local (profil « ollama ») : docker compose --profile ai --profile ollama up -d
  # Le premier lancement télécharge le modèle (environ 2 Go), conservé dans un volume.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Job ponctuel : télécharge le modèle s'il n'est pas déjà présent.
  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [ollama]
    command: ["pull", "${INTERNFLOW_AGENT_LLM_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # Traitements de données, lancés à la demande (profil « tools ») :
  #   docker compose run --rm data seed
  #   docker compose run --rm data pipeline
  data:
    build:
      context: .
      dockerfile: data/Dockerfile
    profiles: [tools]
    environment:
      # `seed` écrit via la couche de persistance de l'API (SQLAlchemy)…
      INTERNFLOW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-internflow}
      # … et `pipeline` lit PostgreSQL avec Spark (JDBC).
      INTERNFLOW_DATA_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-internflow}
      INTERNFLOW_DATA_JDBC_USER: ${POSTGRES_USER}
      INTERNFLOW_DATA_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      # Obligatoire (16 caractères min.) : sans lui, le pipeline refuse de démarrer.
      # Pas de « :? » ici, sinon `docker compose up` exigerait ce secret pour l'API aussi.
      INTERNFLOW_DATA_PSEUDONYMIZATION_SALT: ${INTERNFLOW_DATA_PSEUDONYMIZATION_SALT:-}
      INTERNFLOW_DATA_SPARK_MASTER: ${INTERNFLOW_DATA_SPARK_MASTER:-local[*]}
    volumes:
      - ./data/lake:/lake   # bronze / silver / gold, consultables depuis l'hôte
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  ollama-models:
